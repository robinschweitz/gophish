{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <div class="row">
        <h1 class="page-header">
            Email Templates
        </h1>
    </div>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" onclick="edit(-1)" data-toggle="modal" data-backdrop="static"
            data-target="#modal"><i class="fa fa-plus"></i> New Template</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div id="emptyMessage" class="row" style="display:none;">
        <div class="alert alert-info">
            No templates yet. Let's create one!
        </div>
    </div>
    <div class="row">
        <table id="templateTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Modified Date</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document" style="width:94%; max-width:1320px;">
        <div class="modal-content">
            <!-- New Template Modal -->
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="dismiss()"><span
                        aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="templateModalLabel">New Template</h4>
            </div>
            <div class="modal-body" style="max-height:76vh; overflow-y:auto;">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="name">Name:</label>
                <div class="form-group">
                    <input type="text" class="form-control" ng-model="template.name" placeholder="Template name" id="name"
                        autofocus />
                </div>
                <div class="form-group importEmail">
                    <button class="btn btn-danger" data-toggle="modal" data-backdrop="static" data-target="#importEmailModal"><i
                            class="fa fa-envelope"></i>
                        Import Email</button>
                </div>
                <label class="control-label" for="envelope-sender">Envelope Sender: <i class="fa fa-question-circle" data-toggle="tooltip" data-placement="right" title="This sender is shown to the user by most email clients. Defaults to the SMTP From as defined in the Sending Profile."></i></label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="First Last <test@example.com>" id="envelope-sender" />
                </div>
                <label class="control-label" for="subject">Subject:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Email Subject" id="subject" />
                </div>
                <!-- Nav tabs -->
                <ul class="nav nav-tabs" role="tablist">
                    <li class="active" role="text"><a href="#text" aria-controls="text" role="tab" data-toggle="tab">Text</a></li>
                    <li role="html"><a href="#html" aria-controls="html" role="tab" data-toggle="tab">HTML</a></li>
                </ul>
                <!-- Tab panes -->
                <div class="tab-content">
                    <div role="tabpanel" class="tab-pane active" id="text">
                        <textarea rows="10" id="text_editor" class="gophish-editor form-control" placeholder="Plaintext"></textarea>
                    </div>
                    <div role="tabpanel" class="tab-pane" id="html">
                        <div class="btn-group html-editor-mode" role="group" aria-label="HTML editing mode" style="margin:8px 0;">
                            <button type="button" class="btn btn-primary" id="templateVisualMode" onclick="setTemplateHtmlMode('visual')">Visual</button>
                            <button type="button" class="btn btn-default" id="templateSourceMode" onclick="setTemplateHtmlMode('source')"><i class="fa fa-code"></i> HTML source</button>
                        </div>
                        <div id="templateVisualEditorContainer">
                            <textarea id="html_editor"></textarea>
                        </div>
                        <div id="templateSourceEditorContainer" style="display:none;">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="html_source_editor">HTML source <small class="text-muted">· HTML completion and Gophish tags · Ctrl-Space</small></label>
                                    <div class="gophish-source-editor" style="height:calc(76vh - 300px); min-height:420px;">
                                        <div id="html_source_editor" aria-label="HTML source editor"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="clearfix"><label class="pull-left">Live email preview</label><span class="text-muted pull-right" id="templatePreviewHint">Preview values are sample data</span></div>
                                    <div class="well well-sm"><strong>Subject:</strong> <span id="templatePreviewSubject"></span></div>
                                    <div class="gophish-source-preview" style="height:calc(76vh - 340px); min-height:420px;">
                                        <iframe id="templateSourcePreview" title="Email source preview" sandbox="" style="width:100%; height:100%; border:1px solid #ddd; background:#fff;"></iframe>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="use_tracker_checkbox" type="checkbox" checked>
                    <label for="use_tracker_checkbox">Add Tracking Image</label>
                </div>
                <span class="btn btn-danger btn-file attachmentUpload"><i class="fa fa-plus"></i> Add Files
                    <input id="attachmentUpload" type="file" onchange="attach(this.files)" multiple>
                </span>
                <br />
                <br />
                <table id="attachmentsTable" class="table">
                    <thead>
                        <tr>
                            <th class="col-md-1 no-sort"></th>
                            <th class="col-md-10">Name</th>
                            <th class="col-md-1 no-sort"></th>
                            <th class="datatable_hidden no-sort">Content</th>
                            <th class="datatable_hidden no-sort">Type</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <hr>
            </div>
            <div class="modal-footer">
                <button type="button" data-dismiss="modal" class="btn btn-default" onclick="dismiss()">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save Template</button>
            </div>
        </div>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="importEmailModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <!-- New Email Modal -->
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="importEmailModalLabel">Import Email</h4>
            </div>
            <div class="modal-body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="email">Email Content:</label>
                <div class="form-group">
                    <textarea rows="10" id="email_content" class="gophish-editor form-control" placeholder="Raw Email Source"></textarea>
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="convert_links_checkbox" type="checkbox" checked>
                    <label for="convert_links_checkbox">Change Links to Point to Landing Page</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" data-dismiss="modal" class="btn btn-default">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit" onclick="importEmail()">Import</button>
            </div>
        </div>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="team_modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="campaignModalLabel">Add Team</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <div class="row">
                    <form id="teamTargetForm">
                            <div class="col-sm-4">
                            <label class="control-label" for="team">Add Team:</label>

                            <select class="form-control" placeholder="Team Name" id="team">
                            </select>
                            </div>
                            <div class="col-sm-8">
                            <button type="submit" class="btn btn-danger btn-lg" style="float: right;">
                                <i class="fa fa-plus"></i> Add</button>
                            </div>
                            <option></option>
                    </form>
                </div>
                <br />
                <table id="teamTargetsTable" class="table table-hover table-striped table-condensed">
                    <thead>
                        <tr>
                            <th>Team Name</th>
                            <th>Team Id</th>
                            <th class="no-sort"></th>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal" onclick="dismiss()">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmitTeam">Save changes</button>
            </div>
        </div>
    </div>
</div> 
{{end}}
{{define "scripts"}}
<script src="/js/src/vendor/ckeditor/ckeditor.js?v=html-editor-1"></script>
<script src="/js/src/vendor/ckeditor/adapters/jquery.js"></script>
<script src="/js/dist/app/autocomplete.min.js?v=html-editor-1"></script>
<script src="/js/dist/app/templates.min.js?v=html-editor-1"></script>
<script src="/js/dist/app/utils.min.js"></script>
{{end}}
